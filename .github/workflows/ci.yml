name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest validation for a PR branch; don't cancel another branch's work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    timeout-minutes: 45
    runs-on:
      group: ci-pool
      labels: [self-hosted, Linux, X64, do-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine validation scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch || "$EVENT" == merge_group ]]; then
            scope=full
          else
            scope="$(bash .github/scripts/classify-ci-scope.sh "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $scope"

      - name: Test validation scope classifier
        run: bash scripts/test-ci-scope.sh

      - name: Set up actionlint
        if: steps.scope.outputs.scope != 'docs'
        run: bash .github/scripts/install-actionlint.sh

      - name: Lint GitHub Actions workflows
        id: actionlint
        if: steps.scope.outputs.scope != 'docs'
        run: actionlint -config-file .github/actionlint.yaml .github/workflows/ci.yml .github/workflows/deploy-prod.yml

      - name: Set up Gitleaks
        if: steps.scope.outputs.scope != 'docs'
        run: bash .github/scripts/install-gitleaks.sh

      - name: Scan repository for secrets (CI-only changes)
        id: gitleaks_ci
        if: steps.scope.outputs.scope == 'ci'
        run: gitleaks detect --source . --redact --no-banner

      - name: Prepare infrastructure validation inputs
        if: steps.scope.outputs.scope == 'full'
        env:
          COMPOSE_PROJECT_NAME: nexdoz-infra-ci
        run: |
          set -euo pipefail
          cp .env.dist .env
          sed -i 's|CHANGE_ME_32_BYTE_HEX|0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|g' .env
          # Pull official bases once; build the two patched runtime images once for all checks.
          caddy_image="nexdoz-caddy:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres_image="nexdoz-postgres:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "NEXDOZ_CADDY_CI_IMAGE=$caddy_image" >> "$GITHUB_ENV"
          echo "NEXDOZ_POSTGRES_CI_IMAGE=$postgres_image" >> "$GITHUB_ENV"
          docker pull caddy:2.11.9-alpine
          docker pull caddy:2.11.9-builder-alpine
          docker pull postgres:16.15-alpine3.24
          docker build --no-cache -t "$caddy_image" -f docker/caddy/Dockerfile .
          docker build --no-cache -t "$postgres_image" -f docker/postgres/Dockerfile .

      - name: Set up Trivy
        if: steps.scope.outputs.scope == 'full'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Set up ShellCheck
        if: steps.scope.outputs.scope == 'full'
        run: bash .github/scripts/install-shellcheck.sh

      - name: Run infrastructure and security checks
        id: checks
        if: steps.scope.outputs.scope == 'full'
        run: bash .github/scripts/run-validation-parallel.sh

      - name: CI summary
        if: always()
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          ACTIONLINT_RESULT: ${{ steps.actionlint.outcome }}
          GITLEAKS_RESULT: ${{ steps.gitleaks_ci.outcome }}
          CHECKS_RESULT: ${{ steps.checks.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## CI results'
            echo
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Scope | ${SCOPE:-not determined} |"
            case "${SCOPE:-unknown}" in
              docs)
                echo '| Workflow lint | skipped (documentation-only change) |'
                echo '| Secret scan | skipped (documentation-only change) |'
                echo '| Infrastructure, tests and vulnerability checks | skipped (documentation-only change) |'
                ;;
              ci)
                echo "| Workflow lint | ${ACTIONLINT_RESULT:-not run} |"
                echo "| Secret scan | ${GITLEAKS_RESULT:-not run} |"
                echo '| Infrastructure, tests and image vulnerability checks | skipped (CI-only change) |'
                ;;
              full)
                echo "| Workflow lint | ${ACTIONLINT_RESULT:-not run} |"
                echo '| Secret scan | included in bounded security task |'
                echo "| Infrastructure and image vulnerability checks | ${CHECKS_RESULT:-not run} |"
                ;;
              *) echo '| Scope classification | failed; validation did not complete |' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary validation images
        if: always() && steps.scope.outputs.scope == 'full'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker image rm --force "nexdoz-caddy:ci-${RUN_ID}-${RUN_ATTEMPT}" >/dev/null 2>&1 || true
          docker image rm --force "nexdoz-postgres:ci-${RUN_ID}-${RUN_ATTEMPT}" >/dev/null 2>&1 || true
