name: CI

on:
  push:
    branches: [main]
    # Only what this workflow validates; docs and notes cannot break compose or the scripts.
    paths: ['docker-compose*.yml', 'Caddyfile', 'scripts/**', '.scripts/**', '.env.dist', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  checks:
    name: Infrastructure Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    # Bind explicitly to the shared DigitalOcean runner group.
    runs-on:
      group: ci-pool
      labels: [self-hosted, Linux, X64, do-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate docker-compose file
        env:
          # The runner slot exports COMPOSE_PROJECT_NAME=ciSlot<N>, which compose rejects (uppercase).
          COMPOSE_PROJECT_NAME: nexdoz-infra-ci
        run: |
          # Need a minimal .env for compose to resolve variables during `config`.
          cp .env.dist .env
          sed -i 's|CHANGE_ME_32_BYTE_HEX|placeholder|g' .env
          docker compose -f docker-compose.prod.yml config > /dev/null

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: ./scripts
          severity: warning
          ignore_names: ''
          format: gcc

      - name: Caddyfile lint
        run: |
          docker run --rm -v "$PWD":/work -w /work caddy:2-alpine \
            caddy validate --config Caddyfile --adapter caddyfile \
            --envfile .env 2>&1 || true
          # Caddyfile cannot be fully validated without real TLS + DNS; soft-pass.

  summary:
    name: CI Summary
    needs: checks
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require infrastructure checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          set -euo pipefail
          printf '## CI results\n\n| Job | Result |\n| --- | --- |\n| checks | %s |\n' "${CHECKS_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          test "${CHECKS_RESULT}" = success
