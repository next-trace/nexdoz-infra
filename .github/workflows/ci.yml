name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest validation for a PR branch; don't cancel another branch's work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    timeout-minutes: 45
    runs-on:
      group: ci-pool
      labels: [self-hosted, Linux, X64, do-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine validation scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch || "$EVENT" == merge_group ]]; then
            scope=full
          else
            scope="$(bash .github/scripts/classify-ci-scope.sh "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $scope"

      - name: Test validation scope classifier
        run: bash scripts/test-ci-scope.sh

      - name: Set up actionlint
        if: steps.scope.outputs.scope != 'docs'
        run: bash .github/scripts/install-actionlint.sh

      - name: Lint GitHub Actions workflows
        id: actionlint
        if: steps.scope.outputs.scope != 'docs'
        run: actionlint -config-file .github/actionlint.yaml .github/workflows/ci.yml .github/workflows/deploy-prod.yml

      - name: Set up Gitleaks
        if: steps.scope.outputs.scope != 'docs'
        uses: next-trace/ci-workflows/.github/actions/setup-gitleaks@f8d714598e61b9b81e6e0645051f0d8d6e0d2b5e # v0.1.8
        with:
          version: 8.21.2

      - name: Scan repository for secrets (CI-only changes)
        id: gitleaks_ci
        if: steps.scope.outputs.scope == 'ci'
        run: gitleaks detect --source . --redact --no-banner

      - name: Prepare infrastructure validation inputs
        if: steps.scope.outputs.scope == 'full'
        env:
          COMPOSE_PROJECT_NAME: nexdoz-infra-ci
        run: |
          set -euo pipefail
          cp .env.dist .env
          sed -i 's|CHANGE_ME_32_BYTE_HEX|0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|g' .env
          # Pull each validation image once; all parallel tasks consume the local images.
          docker pull caddy:2-alpine
          docker pull postgres:16-alpine
          docker pull koalaman/shellcheck:v0.10.0

      - name: Set up Trivy
        if: steps.scope.outputs.scope == 'full'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: 0.76.2
          cache: true

      - name: Run infrastructure and security checks
        id: checks
        if: steps.scope.outputs.scope == 'full'
        uses: next-trace/ci-workflows/.github/actions/run-parallel@f8d714598e61b9b81e6e0645051f0d8d6e0d2b5e # v0.1.8
        with:
          max-parallel: '2'
          task-timeout-seconds: '1800'
          tasks: |
            infrastructure= docker compose -f docker-compose.prod.yml config >/dev/null && docker run --rm -v "$PWD":/work -w /work caddy:2-alpine caddy validate --config Caddyfile --adapter caddyfile --envfile .env && for file in scripts/*.sh; do docker run --rm -v "$PWD":/mnt koalaman/shellcheck:v0.10.0 --severity=warning --format=gcc "/mnt/$file"; bash -n "$file"; done
            security= trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 caddy:2-alpine && trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 postgres:16-alpine && gitleaks detect --source . --redact --no-banner

      - name: CI summary
        if: always()
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          ACTIONLINT_RESULT: ${{ steps.actionlint.outcome }}
          GITLEAKS_RESULT: ${{ steps.gitleaks_ci.outcome }}
          CHECKS_RESULT: ${{ steps.checks.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## CI results'
            echo
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Scope | ${SCOPE:-not determined} |"
            case "${SCOPE:-unknown}" in
              docs)
                echo '| Workflow lint | skipped (documentation-only change) |'
                echo '| Secret scan | skipped (documentation-only change) |'
                echo '| Infrastructure, tests and vulnerability checks | skipped (documentation-only change) |'
                ;;
              ci)
                echo "| Workflow lint | ${ACTIONLINT_RESULT:-not run} |"
                echo "| Secret scan | ${GITLEAKS_RESULT:-not run} |"
                echo '| Infrastructure, tests and image vulnerability checks | skipped (CI-only change) |'
                ;;
              full)
                echo "| Workflow lint | ${ACTIONLINT_RESULT:-not run} |"
                echo '| Secret scan | included in bounded security task |'
                echo "| Infrastructure and image vulnerability checks | ${CHECKS_RESULT:-not run} |"
                ;;
              *) echo '| Scope classification | failed; validation did not complete |' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
