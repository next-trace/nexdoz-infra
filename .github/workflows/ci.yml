name: CI

on:
  push:
    branches: [main]
    # Only what this workflow validates; docs and notes cannot break compose or the scripts.
    paths: ['docker-compose*.yml', 'Caddyfile', 'scripts/**', '.scripts/**', '.env.dist', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    timeout-minutes: 60
    runs-on: [self-hosted, linux, x64, do-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate docker-compose file
        env:
          # The runner slot exports COMPOSE_PROJECT_NAME=ciSlot<N>, which compose rejects (uppercase).
          COMPOSE_PROJECT_NAME: nexdoz-infra-ci
        run: |
          # Need a minimal .env for compose to resolve variables during `config`.
          cp .env.dist .env
          sed -i 's|CHANGE_ME_32_BYTE_HEX|placeholder|g' .env
          docker compose -f docker-compose.prod.yml config > /dev/null

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: ./scripts
          severity: warning
          ignore_names: ''
          format: gcc

      - name: Caddyfile lint
        run: |
          docker run --rm -v "$PWD":/work -w /work caddy:2-alpine \
            caddy validate --config Caddyfile --adapter caddyfile \
            --envfile .env 2>&1 || true
          # Caddyfile cannot be fully validated without real TLS + DNS; soft-pass.
