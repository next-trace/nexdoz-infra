name: Deploy to production

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy
        run: |
          ssh deploy@${{ secrets.DROPLET_HOST }} 'bash -s' < scripts/deploy.sh

      - name: Verify healthz
        run: |
          ssh deploy@${{ secrets.DROPLET_HOST }} \
            'curl -sfI https://api.${{ secrets.PROD_DOMAIN }}/healthz'
