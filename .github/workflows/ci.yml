name: CI

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose*.yml'
      - 'Caddyfile'
      - 'scripts/**'
      - '.scripts/**'
      - '.env.dist'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit for the same PR/branch supersedes the older run immediately.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    timeout-minutes: 45
    runs-on:
      group: ci-pool
      labels: [self-hosted, Linux, X64, do-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine validation scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = merge_group ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n%s\n' "${changed:-<none>}"
          if printf '%s\n' "$changed" | grep -Eq '^(docker-compose[^/]*\.ya?ml|Caddyfile|scripts/|\.scripts/|\.env\.dist|\.github/workflows/ci\.yml)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare shared validation inputs
        if: steps.scope.outputs.run == 'true'
        env:
          COMPOSE_PROJECT_NAME: nexdoz-infra-ci
        run: |
          set -euo pipefail
          cp .env.dist .env
          sed -i 's|CHANGE_ME_32_BYTE_HEX|placeholder|g' .env
          # Pull validation images once; checks below only consume these images.
          docker pull caddy:2-alpine
          docker pull koalaman/shellcheck:v0.10.0

      - name: Run infrastructure checks in parallel
        if: steps.scope.outputs.run == 'true'
        env:
          COMPOSE_PROJECT_NAME: nexdoz-infra-ci
        run: |
          set -uo pipefail
          mkdir -p .ci-logs

          docker compose -f docker-compose.prod.yml config >.ci-logs/compose.log 2>&1 &
          compose_pid=$!

          docker run --rm -v "$PWD":/work -w /work caddy:2-alpine \
            caddy validate --config Caddyfile --adapter caddyfile --envfile .env \
            >.ci-logs/caddy.log 2>&1 &
          caddy_pid=$!

          (
            shellcheck_failed=0
            for file in scripts/*.sh; do
              docker run --rm -v "$PWD":/mnt koalaman/shellcheck:v0.10.0 \
                --severity=warning --format=gcc "/mnt/$file" || shellcheck_failed=1
            done
            exit "$shellcheck_failed"
          ) >.ci-logs/shellcheck.log 2>&1 &
          shellcheck_pid=$!

          failed=0
          for check in compose caddy shellcheck; do
            case "$check" in
              compose) pid=$compose_pid; log=.ci-logs/compose.log ;;
              caddy) pid=$caddy_pid; log=.ci-logs/caddy.log ;;
              shellcheck) pid=$shellcheck_pid; log=.ci-logs/shellcheck.log ;;
            esac
            if ! wait "$pid"; then
              failed=1
              echo "::error::$check validation failed"
              sed -n '1,240p' "$log"
            else
              echo "$check validation passed"
            fi
          done
          exit "$failed"

      - name: CI summary
        if: always()
        env:
          RUN_VALIDATION: ${{ steps.scope.outputs.run }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo '## CI results'
            echo
            echo '| Stage | Result |'
            echo '| --- | --- |'
            if [ "${RUN_VALIDATION:-false}" = true ]; then
              echo "| Infrastructure checks | ${JOB_RESULT} |"
            else
              echo '| Infrastructure checks | skipped (docs-only change) |'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
